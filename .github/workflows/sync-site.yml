name: Sync published portfolio

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/snapshot-site.mjs"
      - ".github/workflows/sync-site.yml"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download current portfolio
        run: node scripts/snapshot-site.mjs

      - name: Commit synchronized website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html kronos-audio.html styles.css script.js assets
          if git diff --cached --quiet; then
            echo "Portfolio is already synchronized."
          else
            git commit -m "Sync published portfolio"
            git push
          fi
